server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:aieppay_task;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      schema-locations: classpath:schema/init.sql

  data:
    redis:
      repositories:
        enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aieppay.task.entity

jwt:
  secret: aieppay_crowdsourcing_task_management_system_secret_key_2024
  expiration: 86400000

wx:
  app-id: your_wx_app_id
  app-secret: your_wx_app_secret
  mch-id: your_wx_mch_id
  mch-key: your_wx_mch_key

logging:
  level:
    com.aieppay.task: DEBUG