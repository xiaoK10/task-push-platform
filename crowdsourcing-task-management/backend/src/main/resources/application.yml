server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/aieppay_task?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema/init.sql

  data:
    redis:
      repositories:
        enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aieppay.task.entity

jwt:
  secret: aieppay_crowdsourcing_task_management_system_secret_key_2024
  expiration: 86400000

wx:
  app-id: your_wx_app_id
  app-secret: your_wx_app_secret
  mch-id: your_wx_mch_id
  mch-key: your_wx_mch_key

logging:
  level:
    com.aieppay.task: DEBUG