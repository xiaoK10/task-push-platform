server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/aieppay_task?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: localhost
    port: 6379
    password:
    timeout: 10000ms

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aieppay.task.entity

jwt:
  secret: aieppay_crowdsourcing_task_management_system_secret_key_2024
  expiration: 86400000

wx:
  app-id: your_wx_app_id
  app-secret: your_wx_app_secret
  mch-id: your_wx_mch_id
  mch-key: your_wx_mch_key

logging:
  level:
    com.aieppay.task: DEBUG